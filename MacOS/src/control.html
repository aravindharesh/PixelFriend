<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'"><title>PixelFriend</title><link rel="stylesheet" href="style.css"></head><body class="control"><main><header><img src="../assets/icon.png" alt=""><div><h1>PixelFriend</h1><p>Your friendly water reminder</p></div></header><section class="status" aria-live="polite"><strong id="status">Starting…</strong><p id="countdown"></p></section><div class="controls" role="group" aria-label="Reminder actions"><button id="test" class="primary">▶ Test reminder</button><button id="pause">Pause reminders</button><button id="quit" class="quiet">Quit PixelFriend</button></div><h2>CHOOSE YOUR CHARACTER</h2><div class="characters" role="group" aria-label="Character"><button data-character="character5">Character 1</button><button data-character="character2">Character 2</button><button data-character="character3">Character 3</button><button data-character="character4">Character 4</button></div><div class="preview"><img id="preview" alt="Selected character preview"></div><form id="settings"><h2>YOUR REMINDERS</h2><label>Your name<input id="userName" maxlength="80" placeholder="Friend"></label><label>Cheer message<input id="cheerMessage" maxlength="120" placeholder="Nice! 💙"></label><label>Reminder frequency<select id="interval"><option value="45">Every 45 minutes</option><option value="90">Every 90 minutes</option><option value="120">Every 120 minutes</option><option value="custom">Custom interval</option></select></label><label id="customRow" hidden>Every (minutes)<input id="customIntervalMinutes" type="number" min="1" max="1440"></label><label class="check"><input id="pauseWhenInactive" type="checkbox">Pause when your Mac is inactive</label><label id="idleRow">Consider inactive after (minutes)<input id="inactivityThresholdMinutes" type="number" min="1" max="120"></label><label class="check"><input id="launchAtLogin" type="checkbox">Start PixelFriend automatically when I log in</label><p id="saveStatus" role="status"></p></form><p class="note">Closing this window keeps reminders running from the PixelFriend icon in the menu bar. Click that icon to reopen this window.</p></main><script src="control.js"></script></body></html>
